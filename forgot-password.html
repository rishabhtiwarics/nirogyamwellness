<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirogyam - Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="asets/css/auth.css">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-layout">

      <section class="auth-stage" aria-label="Reset password">
        <div class="auth-form-side">
          <div class="auth-top">
            <a class="auth-brand" href="index.html" aria-label="Nirogyam Wellness home">
              <img src="https://www.nirogyamwellness.com/Images/logo.png" alt="Nirogyam Wellness">
            </a>
            <a class="auth-back" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Home</a>
          </div>
          <div class="auth-card">
          <h1>Forgot Password</h1>
          <p>Enter your email and we'll send reset instructions.</p>

          <form class="auth-form" data-auth-form="forgot">
            <label class="auth-field" for="forgotEmail">
              <span>Email Address</span>
              <span class="auth-control">
                <input id="forgotEmail" name="email" type="email" placeholder="name@example.com" required>
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              </span>
            </label>

            <button class="auth-submit" type="submit">Send Reset Link</button>
            <div class="auth-status" data-auth-status role="status"></div>
            <div class="auth-note"><a href="login.html">Back to Sign In</a></div>
          </form>

          </div>
        </div>

        <div class="auth-visual" aria-hidden="true">
          <img src="asets/img/auth.png" alt="Nirogyam wellness account">
          <div class="auth-visual__badge">
            <span><strong>Secure Access</strong><span>Recover your account with ease.</span></span>
            <i class="fa-solid fa-shield-heart" aria-hidden="true"></i>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="asets/js/auth.js"></script>
</body>

</html>
