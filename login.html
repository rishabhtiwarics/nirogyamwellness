<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirogyam - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="asets/css/auth.css">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-layout">

      <section class="auth-stage" aria-label="Sign in">
        <div class="auth-form-side">
          <div class="auth-top">
            <a class="auth-brand" href="index.html" aria-label="Nirogyam Wellness home">
              <img src="https://www.nirogyamwellness.com/Images/logo.png" alt="Nirogyam Wellness">
            </a>
            <a class="auth-back" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Home</a>
          </div>
          <div class="auth-card">
          <h1>Sign In</h1>
          <p>Enter your details to access your wellness account.</p>

          <form class="auth-form" data-auth-form="login">
            <label class="auth-field" for="loginEmail">
              <span>Email Address</span>
              <span class="auth-control">
                <input id="loginEmail" name="email" type="email" placeholder="name@example.com" required>
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              </span>
            </label>

            <label class="auth-field" for="loginPassword">
              <span class="auth-field__top"><span>Password</span><a href="forgot-password.html">Forgot?</a></span>
              <span class="auth-control">
                <input id="loginPassword" name="password" type="password" placeholder="********" required>
                <button class="auth-password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
              </span>
            </label>

            <button class="auth-submit" type="submit">Sign In</button>
            <div class="auth-note">Don't have an account? <a href="register.html">Create account</a></div>
          </form>

          </div>
        </div>

        <div class="auth-visual" aria-hidden="true">
          <img src="asets/img/auth.png" alt="Nirogyam wellness account">
          <div class="auth-visual__badge">
            <span><strong>Daily Wellness</strong><span>Trusted Nirogyam care, naturally.</span></span>
            <i class="fa-solid fa-leaf" aria-hidden="true"></i>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="asets/js/auth.js"></script>
</body>

</html>
